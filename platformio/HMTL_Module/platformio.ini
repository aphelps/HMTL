# SparkFun ESP32 LoRa 1-CH Gateway. RS485 pins come from the EEPROM config, NOT
# from build flags: RS485Socket::init() calls serial->begin(baud, SERIAL_8N1,
# recvPin, xmitPin) with the configured pins. The on-board RFM95 owns
# GPIO 12/13/14/16/26/32/33 — do not assign them.
#
# Roles, from the schematic netlist (sparkfunX/ESP32_LoRa_1CH_Gateway, esp32_lora_gateway.sch):
#   SCK 14, MISO 12, MOSI 13, CS/NSS 16, DIO0 26, DIO1 33, DIO2 32.
# RESET is NOT on this list because it is NOT WIRED TO THE ESP32 -- net RFM_RST reaches the module
# and a 10k pull-up to 3.3V and stops. SparkFun's own sketches pass 5 or 27 for it; both are
# fiction, and both are pins broken out to the headers. Pass -1.
#
# The radio's SPI is the HSPI-side bus (14/12/13). `board = esp32dev` defaults the global SPI object
# to VSPI (18/19/23/5), so a LoRa driver left on the default talks to nothing AND drives GPIO 23 --
# which is PIXELS_CLOCK below. RFM95Socket::setup() binds SPI explicitly for this reason.
[env:esp32_lora_gw]
platform = espressif32
framework = arduino
board = esp32dev
# LORA_BUILDFLAGS, not GLOBAL_BUILDFLAGS: this is the only env without -DDISABLE_LORA. See the
# comment on OPTION_FLAGS at the top of this file for why that distinction has to be made here
# rather than by leaving the flag out of the defaults.
build_flags = %(LORA_BUILDFLAGS)s -DRS485_HARDWARE_SERIAL=1 -DPIXELS_TYPE=PIXELS_TYPE_WS2801 -DPIXELS_DATA=25 -DPIXELS_CLOCK=23 -DDEBUG_LEVEL=4
lib_ignore = ${common.avr_only_libs}

[env:esp32_routed]
platform = espressif32
framework = arduino
#board = esp32doit-devkit-v1
board = nodemcu-32s
#build_flags = %(GLOBAL_BUILDFLAGS)s -DRS485_HARDWARE_SERIAL=1 -DPIXELS_TYPE=PIXELS_TYPE_APA102 -DPIXELS_DATA=23 -DPIXELS_CLOCK=18 -DDEBUG_LEVEL=4 -DSTARTUP_COMMANDS -DSTARTUP_SPARKLE -DSTARTUP_ARGS=10,0,1,1,100,160,200,255,50,255 -DPIXEL_NUM_OVERRIDE=300 -DBIG_PIXELS
build_flags = %(GLOBAL_BUILDFLAGS)s -DRS485_HARDWARE_SERIAL=1 -DPIXELS_TYPE=PIXELS_TYPE_WS2801 -DPIXELS_DATA=23 -DPIXELS_CLOCK=18 -DDEBUG_LEVEL=4 -DSTARTUP_COMMANDS -DSTARTUP_SPARKLE -DSTARTUP_ARGS=10,0,1,1,100,160,200,255,50,255 -DPIXEL_NUM_OVERRIDE=150 -DBIG_PIXELS -DDEBUG_LEVEL_WIFIBASE=5
lib_ignore = ${common.avr_only_libs}

# ---------------------------------------------------------------------------
# Track 3: AVR firmware build check (simavr_nano)
#
# Compiles the full ATmega328 firmware to catch AVR-specific build errors.
# No emulator is required — `pio run` only builds; `pio test` is not used here.
#
# Usage:
#   cd platformio/HMTL_Module
#   pio run -e simavr_nano
# ---------------------------------------------------------------------------
[env:simavr_nano]
platform    = atmelavr
board       = nanoatmega328
framework   = arduino
build_flags = %(GLOBAL_COMPILEFLAGS)s %(OPTION_FLAGS)s
              -DDEBUG_LEVEL=0
              -DDISABLE_RS485 -DDISABLE_XBEE -DDISABLE_LORA -DDISABLE_MPR121
lib_ignore  = ${common.esp_only_libs}
