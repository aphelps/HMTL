#
# HMTL Module
#

[DEFAULT]

#
# Global configuration settings
#
OBJECT_TYPE=1
GLOBAL_DEBUGLEVEL= -DDEBUG_LEVEL=4

GLOBAL_COMPILEFLAGS= -Wall

# -DDISABLE_LORA is NOT in OPTION_FLAGS.
#
# It used to be, which meant it reached every env through GLOBAL_BUILDFLAGS -- including
# [env:esp32_lora_gw], the one board that HAS a LoRa radio. Nothing consumed the flag, so it was
# inert and the contradiction was invisible. The moment any code is guarded on it, the LoRa board's
# own env is the one that compiles none of that code, and a `pio run -e esp32_lora_gw` that builds
# clean proves nothing at all.
#
# So it lives in GLOBAL_BUILDFLAGS instead, and esp32_lora_gw uses LORA_BUILDFLAGS -- identical in
# every other respect. Adding it here rather than to each of the 24 non-LoRa envs keeps this a
# one-line change per env and leaves every other env's flags byte-identical to what they were.
OPTION_FLAGS = -DDISABLE_MPR121 -DDISABLE_XBEE -DOBJECT_TYPE=%(OBJECT_TYPE)s
GLOBAL_BUILDFLAGS= %(GLOBAL_COMPILEFLAGS)s %(GLOBAL_DEBUGLEVEL)s %(OPTION_FLAGS)s -DDISABLE_LORA
LORA_BUILDFLAGS= %(GLOBAL_COMPILEFLAGS)s %(GLOBAL_DEBUGLEVEL)s %(OPTION_FLAGS)s

[platformio]
lib_dir = /Users/amp/Dropbox/Arduino/libraries
src_dir = ../../HMTL_Module

[common]
avr_only_libs =
  MPR121
  RFM69Socket
  SPIFlash
  RFM69  
  XBeeSocket
esp_only_libs =
  WiFiBase
  TCPSocket
# RFM95Socket and its driver are ESP32-only for the same reason RFM69Socket/RFM69 are AVR-only:
# there is no AVR LoRa endpoint, and only [env:esp32_lora_gw] has a radio. Listed here so the 21
# AVR envs, which all carry `lib_ignore = ${common.esp_only_libs}`, do not try to compile them.
  RFM95Socket
  LoRa

[env:nano]
platform = atmelavr
framework = arduino
board = nanoatmega328
build_flags = %(GLOBAL_BUILDFLAGS)s -DSTARTUP_SPARKLE -DSTARTUP_COMMANDS -DPIXELS_DATA=12 -DPIXELS_CLOCK=8
lib_ignore = ${common.esp_only_libs}

